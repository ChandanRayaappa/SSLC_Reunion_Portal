<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="SSLC Friends Directory">

    <title>SSLC Friends Directory</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Login Card -->

        <section class="card" id="loginSection">

            <header>
                <h1>🎓 SSLC Friends Directory</h1>
                <p>Welcome Back</p>
            </header>

            <form id="memberLoginForm">

                <input
                    type="text"
                    id="memberName"
                    placeholder="Name"
                    autocomplete="off"
                    required>

                <input
                    type="tel"
                    id="memberPhone"
                    placeholder="Phone Number"
                    required>

                <button type="submit">
                    Login
                </button>

            </form>

            <hr>

            <button
                class="admin-btn"
                id="showAdminLoginBtn">

                Admin Login

            </button>

            <p id="loginMessage"></p>

        </section>

        <!-- Admin Login -->

        <dialog id="adminDialog">

            <form method="dialog">

                <h2>Admin Login</h2>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password">

                <div class="dialog-actions">

                    <button
                        type="button"
                        id="adminLoginBtn">

                        Login

                    </button>

                    <button>
                        Close
                    </button>

                </div>

            </form>

        </dialog>

        <!-- Dashboard -->

        <section id="dashboard" class="card hidden">
           

            <header
                class="dashboard-header">

                <h2>Friends Directory</h2>

                <div class="stats">

                    <span>
                        Total:
                        <strong id="totalMembers">
                            0
                        </strong>
                    </span>

                </div>

            </header>
            <button id="logoutBtn">Logout</button>
            <input
                type="search"
                id="searchInput"
                placeholder="Search Name or Phone">

            <section
                id="adminPanel"
                class="hidden">

                <h3>Add Member</h3>

                <div class="add-member-grid">

                    <input
                        type="text"
                        id="newName"
                        placeholder="Name">

                    <input
                        type="tel"
                        id="newPhone"
                        placeholder="Phone">

                    <button
                        id="addMemberBtn">

                        Add Member

                    </button>

                </div>

            </section>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                           <th>#</th>
<th>Name</th>
<th>Phone</th>
<th>Call</th>
<th>WhatsApp</th>
                            <th
                                id="actionColumn"
                                class="hidden">
                                Action
                            </th>
                        </tr>
                    </thead>

                    <tbody id="memberTable">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

   <script src="app.js"></script>

</body>

</html>
