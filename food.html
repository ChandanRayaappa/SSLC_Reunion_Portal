<!DOCTYPE html>
<html>

<head>
    <title>Food Planning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<script>
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href = "index.html";
}
</script>

<div class="page">

    <h1>🍽 Food Planning</h1>

    <button
        class="backBtn"
        onclick="goHome()">
        🏠 Back to Home
    </button>

    <br><br>

    <button
        id="addFoodBtn"
        class="addBtn"
        onclick="showFoodForm()">

        ➕ Add Food Item

    </button>

    <div
        id="foodForm"
        class="hidden">

        <input
            type="number"
            id="foodSlNo"
            placeholder="Sl No">

        <input
            type="text"
            id="foodName"
            placeholder="Food Item Name">

        <button onclick="addFood()">
            Save Food Item
        </button>

        <button
            class="cancelBtn"
            onclick="hideFoodForm()">

            Cancel

        </button>

    </div>

    <br><br>

    <table class="gift-table">

        <thead>

        <tr>

            <th>Sl No</th>
            <th>Item Name</th>
            <th>Estimated Cost</th>
            <th>Actual Cost</th>
            <th>Comments</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody id="foodTable">

        </tbody>

    </table>

    <br>

    <h3>
        Total Estimated :
        <span id="totalEstimated">
            ₹ 0
        </span>
    </h3>

    <h3>
        Total Actual :
        <span id="totalActual">
            ₹ 0
        </span>
    </h3>

</div>

<script>

function goHome(){

    window.location.href =
    "home.html";

}

</script>

<script
type="module"
src="food.js">
</script>

</body>

</html>
