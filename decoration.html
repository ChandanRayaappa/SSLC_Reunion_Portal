<!DOCTYPE html>
<html>

<head>
    <title>Decoration Planning</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<script>
if(localStorage.getItem("loggedIn") !== "true"){
    window.location.href = "index.html";
}
</script>

<div class="page">

    <h1>🎈 Decoration Planning</h1>

    <button
        class="backBtn"
        onclick="goHome()">
        🏠 Back to Home
    </button>

    <br><br>

    <button
        id="addDecorationBtn"
        class="addBtn"
        onclick="showDecorationForm()">

        ➕ Add Decoration Item

    </button>

    <div
        id="decorationForm"
        class="hidden">

        <input
            type="text"
            id="decorationName"
            placeholder="Item Name">

        <button onclick="addDecoration()">
            Save Item
        </button>

        <button
            class="cancelBtn"
            onclick="hideDecorationForm()">

            Cancel

        </button>

    </div>

    <br><br>

    <table class="gift-table">

        <thead>

        <tr>

            <th>Item Name</th>
            <th>Estimated Cost</th>
            <th>Actual Cost</th>
            <th>Comments</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody id="decorationTable">

        </tbody>

    </table>

    <br>

    <h3>
        Total Estimated :
        <span id="totalEstimated">₹ 0</span>
    </h3>

    <h3>
        Total Actual :
        <span id="totalActual">₹ 0</span>
    </h3>

</div>

<script>

function goHome(){

    window.location.href =
    "home.html";

}

</script>

<script
type="module"
src="decoration.js">
</script>

</body>

</html>
