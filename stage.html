<!DOCTYPE html>
<html>
<head>
<title>Stage Function</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
if(localStorage.getItem("loggedIn")!=="true"){
window.location.href="index.html";
}
</script>

<div class="page">

<h1>🎭 Stage Function Planning</h1>

<button
    class="backBtn"
    onclick="goHome()">
    🏠 Back to Home
</button>

<br><br>

<input
id="stageInput"
placeholder="Add Program">

<button onclick="addProgram()">
Add Program
</button>

<div id="stageList"></div>

</div>

<script>

let programs =
JSON.parse(
localStorage.getItem("stage")
) || [];

function renderStage(){

let html="";

programs.forEach((program,index)=>{

html += `
<div class="cardItem">

${program}

<button onclick="editProgram(${index})">
Edit
</button>

<button onclick="deleteProgram(${index})">
Delete
</button>

</div>
`;

});

document.getElementById("stageList")
.innerHTML=html;

}

function addProgram(){

const program=
document.getElementById("stageInput")
.value;

if(!program) return;

programs.push(program);

saveProgram();

}

function editProgram(index){

const updated=
prompt(
"Edit Program",
programs[index]
);

if(updated){

programs[index]=updated;

saveProgram();

}

}

function deleteProgram(index){

programs.splice(index,1);

saveProgram();

}

function saveProgram(){

localStorage.setItem(
"stage",
JSON.stringify(programs)
);

renderStage();

}

renderStage();

</script>
<script>

function goHome(){

    window.location.href =
    "home.html";

}

</script>

</body>
</html>
